apiVersion: v1
kind: ConfigMap
metadata:
  name: node-app-config
  labels:
    app: node-app
data:
  GREETING: "hello from the node app"
  LOG_LEVEL: "info"
  # Env from a ConfigMap is injected at pod start only, so editing this does NOT
  # restart anything on its own — follow an edit with `make restart`
  # (kubectl rollout restart) to pick it up.
  APP_VERSION: "1"
